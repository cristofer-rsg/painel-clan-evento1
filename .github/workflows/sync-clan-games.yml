
name: Sincronizar Jogos do Clã

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline = iniciar captura no começo dos Jogos; poll = atualizar pontuação"
        required: true
        type: choice
        options:
          - poll
          - baseline
        default: poll

permissions:
  contents: read

concurrency:
  group: sincronizar-jogos-clan
  cancel-in-progress: false

jobs:
  sync-games:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: python -m pip install "supabase>=2.5"

      - name: Sincronizar Jogos do Clã
        env:
          CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GAMES_MODE: ${{ inputs.mode || 'poll' }}
        run: python sync_clan_games.py
