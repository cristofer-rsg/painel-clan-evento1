name: Ghost Hunt CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-hunt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ghost-hunt-ci:
    name: ghost-hunt-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: ci-placeholder-secret
      ADMIN_PASSWORD: ci-placeholder-password
      GHOST_HUNT_SESSION_SECRET: ci-placeholder-session-secret
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python dos testes
        working-directory: ..
        run: python -m pip install requests

      - name: Executar testes das automações
        working-directory: ..
        run: python -m unittest discover -s tests -v

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Validar build de produção
        run: npm run build
