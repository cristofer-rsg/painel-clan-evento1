name: Despertar Ghost Hunt

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar navegador
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Acessar e despertar aplicativo
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time

          url = "https://painel-clan-evento1-mtrmtcx7kokl9dczeqtr5w.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=120000)
              time.sleep(10)

              botao = page.get_by_role(
                  "button",
                  name="Yes, get this app back up!",
                  exact=True
              )

              if botao.count() > 0:
                  print("Aplicativo em repouso. Tentando despertar...")
                  botao.click()
                  page.wait_for_timeout(90000)
              else:
                  print("Tela de repouso não encontrada. Aplicativo aparentemente acessível.")

              print("Endereço acessado:", page.url)
              browser.close()
          PY
