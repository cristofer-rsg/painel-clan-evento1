name: Monitorar Ghost Hunt

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verificar site oficial
        env:
          SITE_URL: https://ghosthunt.com.br/
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.request
          import urllib.error

          url = os.environ["SITE_URL"]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "GhostHunt-Uptime-Monitor/1.0"},
              method="GET",
          )

          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  status = response.status
                  body = response.read(500_000).decode("utf-8", errors="replace")

              if status != 200:
                  print(f"FALHA: {url} respondeu HTTP {status}.")
                  sys.exit(1)

              if "ghost hunt" not in body.lower():
                  print("FALHA: o site respondeu, mas o conteúdo esperado do Ghost Hunt não foi encontrado.")
                  sys.exit(1)

              print(f"OK: {url} respondeu HTTP {status} e o conteúdo Ghost Hunt foi localizado.")

          except (urllib.error.URLError, TimeoutError) as error:
              print(f"FALHA ao acessar {url}: {error}")
              sys.exit(1)
          PY
