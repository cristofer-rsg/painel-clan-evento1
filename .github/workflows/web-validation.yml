name: Web validation

on:
  push:
    branches:
      - vercel-rebuild
    paths:
      - "web/**"
      - ".github/workflows/web-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-hunt-web-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: build-only-placeholder
          ADMIN_PASSWORD: build-only-placeholder
          GHOST_HUNT_SESSION_SECRET: build-only-placeholder-secret-for-ci
        run: npm run build
