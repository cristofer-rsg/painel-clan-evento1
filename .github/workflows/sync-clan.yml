name: Sincronizar membros do clã

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "sync_clan.py"
      - ".github/workflows/sync-clan.yml"

permissions:
  contents: read

concurrency:
  group: sincronizar-membros-clan
  cancel-in-progress: false

jobs:
  sync-members:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: python -m pip install "supabase>=2.5"

      - name: Sincronizar membros
        env:
          CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python sync_clan.py
