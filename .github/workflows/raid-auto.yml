name: Ghost Hunt - Raide automático

on:
  schedule:
    # Executa a cada hora, no minuto 17 (UTC).
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-hunt-raid-auto
  cancel-in-progress: false

jobs:
  raid-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip requests

      - name: Validar sintaxe do script
        run: python -m py_compile scripts/raid_automation.py

      - name: Consultar Raide e lançar pontos
        env:
          CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}
          CLASH_CLAN_TAG: "#2GCGP0RQ9"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/raid_automation.py
