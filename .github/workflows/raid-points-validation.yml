name: Raid points planning validation

on:
  push:
    branches:
      - vercel-rebuild
    paths:
      - "scripts/raid_points.py"
      - "tests/test_raid_points.py"
      - ".github/workflows/raid-points-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test raid award planning (no database access)
        run: python -m unittest discover -s tests -v
